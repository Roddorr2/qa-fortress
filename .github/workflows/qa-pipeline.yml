name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    name: E2E + API Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA-Fortress
        uses: actions/checkout@v4

      - name: Checkout StockPulse
        uses: actions/checkout@v4
        with:
          repository: Roddorr2/stockpulse
          path: stockpulse

      - name: Start Docker ecosystem
        working-directory: stockpulse
        run: docker compose -f docker-compose.test.yml up --build -d

      - name: Wait for backend readiness
        run: |
          echo "Waiting for backend readiness (max 300s)..."
          timeout 300 bash -c \
            'until curl -s http://localhost:8081/actuator/health -o /dev/null -w "%{http_code}" | grep -qE "200|401"; do
               echo "Backend not ready yet, retrying in 5s..."; sleep 5
             done'
          echo "Backend is ready and responding."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Tests
        env:
          API_URL: http://localhost:8081/api/v1
          UI_URL: http://localhost:3001
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: stockpulse_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          ADMIN_USER: admin@stockpulse.com
          ADMIN_PASS: admin123
        run: npx playwright test e2e/specs/smoke --project=chromium --workers=1

      - name: Run Regression Tests
        if: github.event_name == 'pull_request'
        env:
          API_URL: http://localhost:8081/api/v1
          UI_URL: http://localhost:3001
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: stockpulse_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          ADMIN_USER: admin@stockpulse.com
          ADMIN_PASS: admin123
        run: npx playwright test e2e/specs/regression e2e/specs/security e2e/specs/concurrency --project=chromium --workers=1

      - name: Run API Contract Tests with Newman
        run: |
          npx newman run api-tests/postman/StockPulse.postman_collection.json \
            --environment api-tests/postman/environments/test.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report/report.html \
            --bail

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15

      - name: Upload Newman Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-report/
          retention-days: 15

      - name: Dump Docker diagnostic logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs stockpulse-backend-test --tail 100 || true
          docker logs stockpulse-postgres-test --tail 50 || true

      - name: Stop Docker ecosystem
        if: always()
        working-directory: stockpulse
        run: docker compose -f docker-compose.test.yml down
